<table
  mat-table
  [dataSource]="dataSource"
  class="tabela"
>
  <!-- Coluna Id -->
  <ng-container matColumnDef="id">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="codigo"
    > Id </th>
    <td
      mat-cell
      *matCellDef="let data"
    > {{data.id}} </td>
  </ng-container>
  <!-- Coluna Nome -->
  <ng-container matColumnDef="nome">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="nome"
    > Nome </th>
    <td
      mat-cell
      *matCellDef="let data"
    > {{data.nome}} </td>
  </ng-container>
  <!-- Coluna Descrição -->
  <ng-container matColumnDef="descricao">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="descricao"
    > Descrição </th>
    <td
      mat-cell
      *matCellDef="let data"
    > {{data.descricao}} </td>
  </ng-container>
  <ng-container matColumnDef="fabricante">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="fabricante"
    > Fabricante </th>
    <td
      mat-cell
      *matCellDef="let data"
    > {{data.fabricante}} </td>
  </ng-container>
  <!-- Coluna Ações -->
  <ng-container matColumnDef="acoes">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="acoes"
    > Ações </th>
    <td
      mat-cell
      *matCellDef="let data"
    >
      <mat-icon
        aria-hidden="false"
        aria-label="Editar"
        (click)="editar(data?.id)"
        class="iconeAcaoTabela"
      >edit</mat-icon>
      <mat-icon
        aria-hidden="false"
        aria-label="Excluir"
        (click)="excluir()"
        class="iconeAcaoTabela"
      >delete_forever</mat-icon>
    </td>
  </ng-container>
  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns"
  ></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;"
  ></tr>
</table>
<mat-paginator
  [pageSizeOptions]="[5, 10, 20]"
  showFirstLastButtons
></mat-paginator>
